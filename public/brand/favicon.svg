<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Custom Apparel">
  <title>Custom Apparel</title>
  <!-- Two heavy knit loops. Tested at 16px: the loops stay separated and do
       not collapse into a letterform, which the 5-loop master mark does. -->
  <rect width="64" height="64" rx="14" fill="#071528"/>
  <g fill="none" stroke="#c8a24a" stroke-width="5" stroke-linecap="round">
    <path d="M14 20 C14 20 15.5 33 21 38 C26.5 33 28 20 28 20"/>
    <path d="M36 20 C36 20 37.5 33 43 38 C48.5 33 50 20 50 20"/>
  </g>
</svg>
